# Memória do build declarada explicitamente, em vez de herdada dos defaults da JVM.
#
# O extrator do CodeQL é um plugin do compilador Kotlin: ele roda dentro do mesmo
# processo que compila e acumula na heap a árvore sintática com os tipos resolvidos.
# Com os defaults, essa compilação instrumentada estourou no runner do GitHub com
# "GC overhead limit exceeded" — de forma intermitente, conforme a folga de memória
# da máquina no momento. Declarar os limites torna o build determinístico aqui e no CI.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx3g
